name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,database]"

      - name: Ruff
        run: ruff check python

      - name: Pytest
        run: pytest

      - name: Browser JavaScript syntax
        run: |
          for file in web/js/*.js; do
            node --check "$file"
          done

      - name: PostgreSQL migration and provenance tests
        run: |
          npm ci --ignore-scripts
          npm run test:db

      - name: Frontend financial semantics
        run: node --test scripts/tests/frontend-*.test.mjs

      - name: Database test dependency audit
        run: npm audit --audit-level=high

      - name: Dependency audit
        run: pip-audit
